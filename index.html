<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Only</title>
</head>
<body>

<audio id="myAudio" autoplay muted loop style="display:none;">
  <source src="https:https://drive.google.com/uc?export=download&id=1r8lGxRd23ua_4Ny1gIsr0PgxUb8blvbB" type=audio/mpeg">

<script>
  const audio = document.getElementById('myAudio');

  window.addEventListener('load', () => {
    audio.play().catch(() => {});
  });

  document.addEventListener('click', () => {
    audio.muted = false;
    audio.play();
  }, { once: true });
</script>

</body>
</html>
