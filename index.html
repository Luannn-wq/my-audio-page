<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Only</title>
</head>
<body>

<audio id="myAudio" autoplay muted loop style="display:none;">
  <source src="Ariana Grande - positions (Clean - Lyrics).mp3" type="audio/mpeg">
</audio>

<script>
  const audio = document.getElementById('myAudio');

  window.addEventListener('load', () => {
    audio.play().catch(() => {});
  });

  document.addEventListener('click', () => {
    audio.muted = false;
    audio.play();
  }, { once: true });
</script>

</body>
</html>
